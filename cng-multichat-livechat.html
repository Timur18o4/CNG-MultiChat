function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function safeUrl(v){
  try{
    const s=String(v??"").trim();
    if(/^data:image\/(?:png|jpeg|jpg|gif|webp);base64,/i.test(s)) return s;
    const u=new URL(s);
    return (u.protocol==="https:"||u.protocol==="http:") ? u.href : "";
  }catch{return ""}
}

function plat(v){

/* Kick sends native emotes in the form:
   [emote:4147902:KEKBye]
   Kick's emote CDN uses /emotes/{id}/fullsize. */
function renderKick(text){
  let out="";
  let last=0;
  const re=/\[emote:(\d+):([^\]]+)\]/g;
  let m;

  while((m=re.exec(String(text??"")))!==null){
    out+=esc(String(text).slice(last,m.index));

    const url="https://files.kick.com/emotes/"+m[1]+"/fullsize";
    out+=`<img class="chat-emote" src="${url}" alt="${esc(m[2])}" title="${esc(m[2])}" onerror="this.replaceWith(document.createTextNode(${JSON.stringify(m[2])}))">`;

    last=m.index+m[0].length;
  }

  out+=esc(String(text??"").slice(last));
  return out;
}

/* Twitch IRC gives emote ranges like:
   25:0-4/1902:6-10
   Twitch ranges are UTF-16 indexes, so JS substring is exactly what we need. */
function renderTwitch(text, raw){
  const source=String(text??"");
  const spec=String(raw??"");
  if(!spec) return esc(source);

  const ranges=[];

  for(const group of spec.split("/")){
    const parts=group.split(":");
    if(parts.length<2) continue;

    const id=parts[0];

    for(const range of parts[1].split(",")){
      const p=range.split("-");
      if(p.length!==2) continue;

      const start=Number(p[0]);
      const end=Number(p[1]);

      if(Number.isInteger(start)&&Number.isInteger(end)&&start>=0&&end>=start){
        ranges.push({id,start,end});
      }
    }
  }

  ranges.sort((a,b)=>a.start-b.start);

  let out="";
  let pos=0;

  for(const r of ranges){
    if(r.start<pos) continue;

    out+=esc(source.slice(pos,r.start));

    const emoteText=source.slice(r.start,r.end+1);
    const url=`https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(r.id)}/default/dark/3.0`;

    out+=`<img class="chat-emote" src="${url}" alt="${esc(emoteText)}" title="${esc(emoteText)}" onerror="this.replaceWith(document.createTextNode(${JSON.stringify(emoteText)}))">`;

    pos=r.end+1;
  }

  out+=esc(source.slice(pos));
  return out;
}

function renderCng(text, emotes){
  const source=String(text??"");
  const list=Array.isArray(emotes)?emotes:[];
  const matches=[];
  const dynamicTokenOffsets=new Map();

  // Keep explicitly resolved URLs, then fill gaps from the complete CNG map.
  for(const e of list){
    if(!e || typeof e!=="object") continue;
    const url=safeUrl(e.url||e.image_url||e.imageUrl||e.src||e.image||"");
    if(!url) continue;

    const rawToken=String(e.token||e.code||e.text||e.name||"").trim();
    const name=String(e.name||rawToken||"").trim();
    const rawStart=e.start;
    const rawEnd=e.end;
    const start=Number(rawStart);
    const end=Number(rawEnd);

    if(rawStart!==undefined&&rawStart!==null&&rawStart!==""&&rawEnd!==undefined&&rawEnd!==null&&rawEnd!==""&&Number.isInteger(start)&&Number.isInteger(end)&&start>=0&&end>=start&&end<source.length){
      matches.push({start,end,url,name,dynamic:true});
      continue;
    }

    if(!rawToken) continue;
    const token=/^:[a-zA-Z0-9_]+:$/.test(rawToken)
      ? rawToken
      : (/^[a-zA-Z0-9_]+$/.test(rawToken)?`:${rawToken}:`:rawToken);
    const searchFrom=dynamicTokenOffsets.get(token)||0;
    const index=source.indexOf(token,searchFrom);
    if(index<0) continue;
    matches.push({start:index,end:index+token.length-1,url,name,dynamic:true});
    dynamicTokenOffsets.set(token,index+token.length);
  }

  const tokenPattern=/:([a-zA-Z0-9_]+):/g;
  let tokenMatch;
  while((tokenMatch=tokenPattern.exec(source))!==null){
    const token=tokenMatch[0];
    const start=tokenMatch.index;
    const end=start+token.length-1;
    const alreadyResolved=matches.some(m=>m.start<=start&&m.end>=end);
    if(alreadyResolved) continue;
    const url=safeUrl(CNG_EMOTES[token.toLowerCase()]||"");
    if(url) matches.push({start,end,url,name:token,dynamic:false});
  }

  matches.sort((a,b)=>a.start-b.start||(b.dynamic?1:0)-(a.dynamic?1:0));
  let out="";
  let pos=0;
  for(const match of matches){
    if(match.start<pos||match.start<0||match.end<match.start||match.end>=source.length) continue;
    out+=esc(source.slice(pos,match.start));
    const token=source.slice(match.start,match.end+1);
    out+=`<img class="chat-emote cng-emote" src="${esc(match.url)}" alt="${esc(token)}" title="${esc(match.name||token)}" onerror="this.replaceWith(document.createTextNode(this.alt))">`;
    pos=match.end+1;
  }
  return out+esc(source.slice(pos));
}

function ttUrlFromObject(x){
  if(!x) return "";
  if(typeof x==="string"){
    return /^https?:\/\//i.test(x) &&
      /(tiktokcdn|ibytedtos|muscdn|byteimg|p16-|p19-|p77-|p9-)/i.test(x)
      ? x : "";
  }
  if(Array.isArray(x)){
    for(const v of x){
      const u=ttUrlFromObject(v);
      if(u) return u;
    }
    return "";
  }
  if(typeof x==="object"){
    for(const k of ["url","image_url","imageUrl","uri","src"]){
      if(x[k]){
        const u=ttUrlFromObject(x[k]);
        if(u) return u;
      }
    }
    for(const k of Object.keys(x)){
      const u=ttUrlFromObject(x[k]);
      if(u) return u;
    }
  }
  return "";
}

function renderTikTok(text, emotes){
  const source=String(text??"");
  const list=Array.isArray(emotes)?emotes:[];
  if(!list.length) return esc(source);

  const ranges=list
    .map(e=>({
      url:safeUrl(e?.url||e?.image_url||e?.imageUrl||e?.src||""),
      start:Number(e?.start),
      end:Number(e?.end),
      token:String(e?.token||""),
      name:String(e?.name||e?.emoteId||e?.token||"")
    }))
    .filter(e=>e.url && Number.isInteger(e.start) && Number.isInteger(e.end))
    .sort((a,b)=>a.start-b.start);

  if(ranges.length){
    let out="";
    let pos=0;
    for(const r of ranges){
      if(r.start<pos || r.start<0 || r.end<r.start || r.end>=source.length) continue;
      out+=esc(source.slice(pos,r.start));
      const token=source.slice(r.start,r.end+1);
      out+=`<img class="chat-emote tiktok-emote" src="${esc(r.url)}" alt="${esc(r.name||token)}" title="${esc(r.name||token)}" onerror="this.replaceWith(document.createTextNode(${JSON.stringify(token)}))">`;
      pos=r.end+1;
    }
    out+=esc(source.slice(pos));
    return out;
  }

  // Token fallback: newer TikTokLive builds can expose the emote URL while
  // the character index is not usable as a JavaScript string offset.
  let out="";
  let pos=0;
  for(const r of list){
    const url=safeUrl(r?.url||r?.image_url||r?.imageUrl||r?.src||"");
    const token=String(r?.token||"");
    if(!url || !token) continue;
    const idx=source.indexOf(token,pos);
    if(idx<0) continue;
    out+=esc(source.slice(pos,idx));
    out+=`<img class="chat-emote tiktok-emote" src="${esc(url)}" alt="${esc(r?.name||token)}" title="${esc(r?.name||token)}" onerror="this.replaceWith(document.createTextNode(${JSON.stringify(token)}))">`;
    pos=idx+token.length;
  }
  out+=esc(source.slice(pos));
  return out;
}

function renderYouTube(text, emotes){
  const source=String(text??"");
  const list=Array.isArray(emotes)?emotes:[];
  const items=list.map(e=>({
    url:safeUrl(e?.url||e?.image_url||e?.imageUrl||e?.src||""),
    start:Number(e?.start), end:Number(e?.end),
    token:String(e?.token||""), name:String(e?.name||e?.id||"")
  })).filter(e=>e.url);
  let out="",cursor=0;
  for(const e of items.sort((a,b)=>(a.start||1e9)-(b.start||1e9))){
    if(Number.isInteger(e.start)&&Number.isInteger(e.end)&&e.start>=cursor&&e.end<source.length){
      out+=esc(source.slice(cursor,e.start));
      const t=source.slice(e.start,e.end+1);
      out+=`<img class="chat-emote" src="${esc(e.url)}" alt="${esc(e.name||t)}" title="${esc(e.name||t)}">`;
      cursor=e.end+1;
    }
  }
  if(cursor) return out+esc(source.slice(cursor));
  out="";cursor=0;
  for(const e of items){
    let t=e.token;
    if(t && !source.includes(t)){const b="["+t.replace(/^\\[|\\]$/g,"")+"]";if(source.includes(b))t=b;}
    if(!t)continue;
    const i=source.indexOf(t,cursor);if(i<0)continue;
    out+=esc(source.slice(cursor,i));
    out+=`<img class="chat-emote" src="${esc(e.url)}" alt="${esc(e.name||t)}" title="${esc(e.name||t)}">`;
    cursor=i+t.length;
  }
  return out+esc(source.slice(cursor));
}

function renderMessage(d){
  const p=plat(d.platform);
  if(p==="twitch") return renderTwitch(d.message,d.twitchEmotes||d.twitch_emotes||"");
  if(p==="kick") return renderKick(d.message);
  if(p==="cng") return renderCng(d.message,d.cngEmotes||d.cng_emotes||d.emotes||d.emoteList||[]);
  if(p==="tiktok") return renderTikTok(d.message,d.tiktokEmotes||d.tiktok_emotes||d.emotes||d.emoteList||[]);
  if(p==="youtube") return renderYouTube(d.message,d.youtubeEmotes||d.youtube_emotes||d.emotes||d.emoteList||[]);
  return esc(d.message||"");
}

function addMessage(d){
  const p=plat(d.platform);
  const e=document.createElement("div");
  e.className="message "+p;

  const avatar=safeUrl(d.avatar)
    ? `<img class="avatar" src="${esc(safeUrl(d.avatar))}" onerror="this.style.visibility='hidden'">`
    : `<div class="avatar"></div>`;

  const badges=Array.isArray(d.badges)
    ? d.badges.map(x=>`<span class="badge">${esc(x)}</span>`).join("")
    : "";

  e.innerHTML=`
    ${avatar}
    <div class="content">
      <div class="head">
        <span class="platform">${pname(p)}</span>
        <span class="name">${esc(d.username||"Unbekannt")}</span>
        <span class="badges">${badges}</span>
      </div>
      <div class="text">${renderMessage(d)}</div>
    </div>`;

  chat.appendChild(e);

  while(chat.children.length>CONFIG.maxMessages)
    chat.firstElementChild.remove();
}

window.UnifiedChat={

function dockPlatform(v){const p=String(v||"").toLowerCase();return ({yt:"YOUTUBE",youtube:"YOUTUBE",tt:"TIKTOK",tiktok:"TIKTOK",twitch:"TWITCH",kick:"KICK",cng:"CNG"})[p]||p.toUpperCase()||"CHAT"}

const DISPLAY_CONFIG={
  nameColorMode:"auto",fixedNameColor:"#ffffff",
  nameColorPalette:["#ff6b6b","#4dabf7","#51cf66","#ffd43b","#cc5de8","#20c997","#ff922b","#f06595"],
  platformNameColors:{twitch:"#9147ff",kick:"#53e000",cng:"#ff8a00",tiktok:"#25f4ee",youtube:"#ff0000"},
  userNameColors:{},messageTextColor:"#eee7f4"
};
let managerConfigSignature="";
let fontUserOverride=false;
function normalizedColor(value,fallback){const color=String(value||"").trim();return /^#[0-9a-f]{6}$/i.test(color)?color.toLowerCase():fallback}
function stableNameHash(name){const key=String(name??"").trim().toLowerCase();let hash=0;for(let i=0;i<key.length;i++)hash=((hash<<5)-hash)+key.charCodeAt(i)|0;return {key,hash}}
function colorPlatformKey(value){const p=String(value||"").toLowerCase();return ({yt:"youtube",tt:"tiktok"})[p]||p}
function resolveNameColor(name,platform){const {key,hash}=stableNameHash(name);if(!key)return "#ffffff";if(DISPLAY_CONFIG.userNameColors[key])return DISPLAY_CONFIG.userNameColors[key];switch(DISPLAY_CONFIG.nameColorMode){case "palette":return DISPLAY_CONFIG.nameColorPalette[Math.abs(hash)%DISPLAY_CONFIG.nameColorPalette.length]||"#ffffff";case "platform":return DISPLAY_CONFIG.platformNameColors[colorPlatformKey(platform)]||"#ffffff";case "fixed":return DISPLAY_CONFIG.fixedNameColor;default:return `hsl(${Math.abs(hash)%360} 68% 68%)`}}
function recolorDockNames(){feed.querySelectorAll(".user[data-username]").forEach(el=>{const color=resolveNameColor(el.dataset.username,el.dataset.platform);el.style.setProperty("color",color,"important");el.style.setProperty("-webkit-text-fill-color",color,"important")})}
function applyDockDisplayConfig(data){
  if(!data||typeof data!=="object")return;
  const signature=JSON.stringify({font:data.chat_font_size,mode:data.name_color_mode,fixed:data.fixed_name_color,palette:data.name_color_palette,platforms:data.platform_name_colors,users:data.user_name_colors,message:data.message_text_color});
  if(signature===managerConfigSignature)return;
  managerConfigSignature=signature;
  const allowed=["auto","palette","platform","fixed"],mode=String(data.name_color_mode||"auto").toLowerCase();DISPLAY_CONFIG.nameColorMode=allowed.includes(mode)?mode:"auto";
  DISPLAY_CONFIG.fixedNameColor=normalizedColor(data.fixed_name_color,"#ffffff");
  const palette=Array.isArray(data.name_color_palette)?data.name_color_palette.map(c=>normalizedColor(c,"")).filter(Boolean):[];DISPLAY_CONFIG.nameColorPalette=palette.length?palette:["#ff6b6b","#4dabf7","#51cf66","#ffd43b","#cc5de8","#20c997","#ff922b","#f06595"];
  const defaults={twitch:"#9147ff",kick:"#53e000",cng:"#ff8a00",tiktok:"#25f4ee",youtube:"#ff0000"},platforms=data.platform_name_colors&&typeof data.platform_name_colors==="object"?data.platform_name_colors:{};DISPLAY_CONFIG.platformNameColors=Object.fromEntries(Object.entries(defaults).map(([p,c])=>[p,normalizedColor(platforms[p],c)]));
  const users=data.user_name_colors&&typeof data.user_name_colors==="object"?data.user_name_colors:{};DISPLAY_CONFIG.userNameColors={};Object.entries(users).forEach(([name,color])=>{const key=String(name||"").trim().toLowerCase(),valid=normalizedColor(color,"");if(key&&valid)DISPLAY_CONFIG.userNameColors[key]=valid});
  document.documentElement.style.setProperty("--message-text-color",normalizedColor(data.message_text_color,"#eee7f4"));
  const managerFont=Number(data.chat_font_size);if(Number.isFinite(managerFont)){fontUserOverride=false;chatFont=Math.max(8,Math.min(24,Math.round(managerFont*11/14)));applyFont()}
  recolorDockNames();
}
async function loadDockDisplayConfig(){try{const response=await fetch(`${window.location.origin}/config`,{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);applyDockDisplayConfig(await response.json())}catch(err){console.warn("[Unified] Anzeigeeinstellungen konnten nicht geladen werden:",err)}}

let ttsEnabled=false;
let ttsQueue=[];
let ttsSpeaking=false;
let ttsUsername=true;
let ttsPlatform=false;
let ttsRate=1.0;
let ttsVolume=1.0;
let ttsVoice=null;

function getTtsText(d){
  const message=String(d?.message??d?.text??"").trim();
  if(!message) return "";

  const platform=dockPlatform(d?.platform);
  const username=String(d?.username??d?.user??d?.author??"").trim();

  let clean=message
    .replace(/\[emote:\d+:[^\]]+\]/gi,"")
    .replace(/:[a-zA-Z0-9_]+:/g,"")
    .replace(/\s+/g," ")
    .trim();

  if(!clean) return "";

  let prefix="";
  if(ttsPlatform && platform && platform!=="CHAT")
    prefix+=platform+" ";

  if(ttsUsername && username)
    prefix+=username+" sagt: ";

  return prefix+clean;
}

function selectTtsVoice(){
  if(!("speechSynthesis" in window)) return;
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length) return;

  ttsVoice=
    voices.find(v=>/^de-DE$/i.test(v.lang)) ||
    voices.find(v=>/^de(-|_)/i.test(v.lang)) ||
    voices[0] ||
    null;
}

function speakNext(){
  if(!ttsEnabled || ttsSpeaking || !ttsQueue.length) return;
  if(!("speechSynthesis" in window)) return;

  const text=ttsQueue.shift();
  if(!text){
    speakNext();
    return;
  }

  ttsSpeaking=true;

  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang=ttsVoice?.lang || "de-DE";
  utterance.rate=ttsRate;
  utterance.volume=ttsVolume;
  if(ttsVoice) utterance.voice=ttsVoice;

  utterance.onend=()=>{
    ttsSpeaking=false;
    speakNext();
  };

  utterance.onerror=()=>{
    ttsSpeaking=false;
    speakNext();
  };

  window.speechSynthesis.speak(utterance);
}

function queueTts(d){
  if(!ttsEnabled) return;

  const text=getTtsText(d);
  if(!text) return;

  ttsQueue.push(text);

  if(ttsQueue.length>10)
    ttsQueue.splice(0,ttsQueue.length-10);

  speakNext();
}

function setTtsEnabled(enabled){
  ttsEnabled=enabled;

  const btn=document.getElementById("tts");
  if(btn){
    btn.textContent=ttsEnabled?"🔊 TTS AN":"🔊 TTS AUS";
    btn.classList.toggle("active",ttsEnabled);
  }

  if(ttsEnabled){
    selectTtsVoice();

    // User interaction unlocks speech on browsers that require it.
    try{
      window.speechSynthesis.cancel();
      const unlock=new SpeechSynthesisUtterance("");
      unlock.volume=0;
      window.speechSynthesis.speak(unlock);
    }catch(e){}

    speakNext();
  }else{
    ttsQueue=[];
    if("speechSynthesis" in window)
      window.speechSynthesis.cancel();
    ttsSpeaking=false;
  }
}

document.getElementById("tts").onclick=()=>{
  setTtsEnabled(!ttsEnabled);
};

if("speechSynthesis" in window){
  selectTtsVoice();
  window.speechSynthesis.onvoiceschanged=selectTtsVoice;
}else{
  const btn=document.getElementById("tts");
  if(btn){
    btn.textContent="🔊 TTS nicht verfügbar";
    btn.disabled=true;
  }
}

try{
  const es=new EventSource("http://127.0.0.1:8765/events");

  es.onopen=()=>{

}
